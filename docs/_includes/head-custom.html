<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: false, theme: "neutral" });
  document.addEventListener("DOMContentLoaded", async () => {
    const blocks = document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid");
    let i = 0;
    for (const el of blocks) {
      const box = el.tagName === "CODE" ? el.parentElement : el;
      const d = document.createElement("div");
      d.className = "mermaid";
      box.replaceWith(d);
      try {
        const { svg } = await mermaid.render("mmd-" + (i++), el.textContent);
        d.innerHTML = svg;
        d.dataset.processed = "true";
      } catch (e) {
        d.textContent = el.textContent;
      }
    }
  });
</script>
